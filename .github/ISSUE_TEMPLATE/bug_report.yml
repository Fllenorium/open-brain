name: Bug report
description: Something does the wrong thing.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Bind an agent to …
        2. Call brain_open …
    validations:
      required: true
  - type: input
    attributes:
      label: Where it runs
      description: Docker, Vercel, local dev — and which Postgres (PGlite, Neon, Supabase, …).
  - type: input
    attributes:
      label: Which agent client
      description: Claude Code, Cursor, something else — only if the bug involves an agent.
  - type: textarea
    attributes:
      label: Logs
      description: Server output around the failure. Take out tokens and credentials first.
      render: text
